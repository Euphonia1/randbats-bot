[project]
name = "psjax"
version = "0.1.0"
description = "Pokemon Showdown's Gen 9 battle simulator, reimplemented in JAX"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["psjax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
